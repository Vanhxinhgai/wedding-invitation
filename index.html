<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thư mời cưới</title>

  <link rel="preload" as="image" href="assets/anh1-mobile.jpg" />
  <link rel="preload" as="image" href="assets/anh2-mobile.jpg" />
  <link rel="preload" as="image" href="assets/anh3-mobile.jpg" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .phone-screen {
      width: 100vw;
      height: 100vh;
      background: #f7f7f7;
      overflow: hidden;
      position: relative;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 24px 78px;
      overflow: hidden;
      opacity: 0.45;
      transform: translate3d(0, 100%, 0);
      transition:
        transform 920ms cubic-bezier(0.19, 1, 0.22, 1),
        opacity 520ms ease;
      will-change: transform, opacity;
      backface-visibility: hidden;
      contain: layout paint style;
    }

    .page-content {
      width: 100%;
      max-width: 360px;
      text-align: center;
      opacity: 0;
      transform: translate3d(0, 42px, 0) scale(0.99);
      transition:
        opacity 720ms ease,
        transform 920ms cubic-bezier(0.19, 1, 0.22, 1);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .page.active {
      opacity: 1;
      z-index: 2;
    }

    .page.active .page-content {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .page.is-dragging,
    .page.is-dragging .page-content,
    .page.is-dragging .text-box,
    .page.is-dragging .small-text,
    .page.is-dragging .main-title,
    .page.is-dragging .sub-text,
    .page.is-dragging .invitation-img {
      transition-duration: 0ms !important;
    }

    .text-box {
      margin-bottom: 22px;
      opacity: 0;
      transform: translate3d(0, 28px, 0) scale(0.98);
      transition:
        opacity 740ms ease,
        transform 900ms cubic-bezier(0.19, 1, 0.22, 1);
      will-change: transform, opacity;
    }

    .page.active .text-box {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .small-text {
      font-size: 11px;
      letter-spacing: 3px;
      color: #b5b5b5;
      margin-bottom: 10px;
    }

    .main-title {
      font-family: Georgia, serif;
      font-size: 25px;
      line-height: 1.45;
      color: #a9a9a9;
      font-weight: bold;
    }

    .sub-text {
      margin-top: 10px;
      font-size: 12px;
      color: #b8b8b8;
      letter-spacing: 1.5px;
      line-height: 1.7;
    }
    .small-text,
    .main-title,
    .sub-text {
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      transition:
        opacity 640ms ease,
        transform 820ms cubic-bezier(0.19, 1, 0.22, 1);
      will-change: transform, opacity;
    }

    .page.active .small-text {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition-delay: 0.08s;
    }

    .page.active .main-title {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition-delay: 0.18s;
    }

    .page.active .sub-text {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition-delay: 0.28s;
    }

    .invitation-img {
      width: 100%;
      max-height: 62vh;
      object-fit: contain;
      display: block;
      border-radius: 14px;
      opacity: 0;
      transform: translate3d(0, 28px, 0) scale(0.96);
      transition:
        opacity 700ms ease 0.18s,
        transform 920ms cubic-bezier(0.19, 1, 0.22, 1) 0.18s;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.12);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .page.active .invitation-img {
      opacity: 0.92;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .hint {
      position: absolute;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #b7b7b7;
      letter-spacing: 1px;
      animation: floatHint 1.5s infinite;
    }

    @keyframes floatHint {
      0% {
        transform: translateX(-50%) translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: translateX(-50%) translateY(8px);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) translateY(0);
        opacity: 0.5;
      }
    }

    .bottom-icons {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 58px;
      background: rgba(247, 247, 247, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .icon-left,
    .icon-right {
      position: fixed;
      bottom: 18px;
      width: 28px;
      height: 28px;
      border: 1.5px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #333;
      background: #f7f7f7;
      z-index: 11;
      cursor: pointer;
      user-select: none;
      transition:
        transform 260ms cubic-bezier(0.16, 1, 0.3, 1),
        background-color 260ms ease;
    }

    .icon-left:active,
    .icon-right:active {
      transform: scale(0.92);
      background: #ededed;
    }

    .icon-left {
      left: 24px;
    }

    .icon-right {
      right: 24px;
    }

    @media screen and (min-width: 600px) {
      .phone-screen {
        width: 390px;
        height: 844px;
        margin: 30px auto;
        border-radius: 36px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      }

      .page {
        height: 100%;
      }

      .bottom-icons {
        width: 390px;
        left: 50%;
        transform: translateX(-50%);
        bottom: 30px;
        border-bottom-left-radius: 36px;
        border-bottom-right-radius: 36px;
      }

      .icon-left {
        left: calc(50% - 171px);
        bottom: 48px;
      }

      .icon-right {
        right: calc(50% - 171px);
        bottom: 48px;
      }
    }
  </style>
</head>

<body>
  <div class="phone-screen" id="phoneScreen">

    <section class="page active">
      <div class="page-content">
        <div class="text-box">
          <div class="small-text">SAVE THE DATE</div>
          <div class="main-title">
            PHƯƠNG THẢO<br />
            &<br />
            ĐỨC ANH
          </div>
          <div class="sub-text">14 . 06 . 2026</div>
        </div>

        <img class="invitation-img" src="assets/anh1-mobile.jpg" alt="Ảnh cưới 1" decoding="async" fetchpriority="high" />
      </div>

      <div class="hint">LƯỚT XUỐNG</div>
    </section>

    <section class="page">
      <div class="page-content">
        <div class="text-box">
          <div class="small-text">TRÂN TRỌNG KÍNH MỜI</div>
          <div class="main-title">
            LỄ THÀNH HÔN
          </div>
          <div class="sub-text">Thân mời bạn cùng gia đình tham dự tiệc cưới</div>
        </div>

        <img class="invitation-img" src="assets/anh2-mobile.jpg" alt="Ảnh cưới 2" decoding="async" />
      </div>

      <div class="hint">LƯỚT XUỐNG</div>
    </section>

    <section class="page">
      <div class="page-content">
        <div class="text-box">
          <div class="small-text">WEDDING INVITATION</div>
          <div class="main-title">
            HẸN GẶP<br />
            TẠI BỮA TIỆC
          </div>
          <div class="sub-text">Sự hiện diện của bạn là niềm vui của gia đình</div>
        </div>

        <img class="invitation-img" src="assets/anh3-mobile.jpg" alt="Ảnh cưới 3" decoding="async" />
      </div>
    </section>

  </div>

  <div class="bottom-icons"></div>
  <div class="icon-left">⌕</div>
  <div class="icon-right">↑</div>

  <script>
    const phoneScreen = document.getElementById("phoneScreen");
    const prevButton = document.querySelector(".icon-left");
    const nextButton = document.querySelector(".icon-right");
    const pages = Array.from(document.querySelectorAll(".page"));
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let currentPage = 0;
    let startY = 0;
    let dragY = 0;
    let lastY = 0;
    let lastTime = 0;
    let velocityY = 0;
    let rafId = 0;
    let pendingProgress = 0;
    let isDragging = false;
    let isAnimating = false;
    let wheelTimer;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setPages(progress = 0, dragging = false) {
      pages.forEach((page, index) => {
        const offset = (index - currentPage) * 100 + progress;
        const distance = Math.min(Math.abs(offset) / 100, 1);
        const content = page.querySelector(".page-content");
        const contentShift = offset * -0.16;

        page.style.transform = `translate3d(0, ${offset}%, 0)`;
        page.style.opacity = String(1 - distance * 0.55);
        page.classList.toggle("active", Math.abs(offset) < 0.52);
        page.classList.toggle("is-dragging", dragging);

        if (dragging && content) {
          content.style.transform = `translate3d(0, ${contentShift}px, 0) scale(${1 - distance * 0.01})`;
        } else if (content) {
          content.style.transform = "";
        }
      });
    }

    function renderDrag() {
      rafId = 0;
      setPages(pendingProgress, true);
    }

    function scheduleDrag(progress) {
      pendingProgress = progress;

      if (!rafId) {
        rafId = window.requestAnimationFrame(renderDrag);
      }
    }

    function goToPage(nextPage) {
      const target = clamp(nextPage, 0, pages.length - 1);

      if (target === currentPage) {
        setPages(0);
        return;
      }

      currentPage = target;
      isAnimating = true;
      setPages(0);

      const duration = prefersReducedMotion ? 120 : 1180;
      window.setTimeout(() => {
        isAnimating = false;
      }, duration);
    }

    function startDrag(event) {
      if (event.touches.length !== 1) return;

      startY = event.touches[0].clientY;
      lastY = startY;
      lastTime = performance.now();
      velocityY = 0;
      dragY = 0;
      isDragging = true;
      isAnimating = false;
      setPages(0, true);
    }

    function moveDrag(event) {
      if (!isDragging) return;

      dragY = event.touches[0].clientY - startY;
      const now = performance.now();
      const deltaY = event.touches[0].clientY - lastY;
      const deltaTime = Math.max(now - lastTime, 16);
      velocityY = deltaY / deltaTime;
      lastY = event.touches[0].clientY;
      lastTime = now;

      const screenHeight = phoneScreen.clientHeight || window.innerHeight;
      const atFirstPage = currentPage === 0 && dragY > 0;
      const atLastPage = currentPage === pages.length - 1 && dragY < 0;
      const resistance = atFirstPage || atLastPage ? 0.22 : 0.86;
      const progress = clamp((dragY / screenHeight) * 100 * resistance, -72, 72);

      event.preventDefault();
      scheduleDrag(progress);
    }

    function endDrag() {
      if (!isDragging) return;

      const screenHeight = phoneScreen.clientHeight || window.innerHeight;
      const projectedY = dragY + velocityY * 180;
      const shouldMove = Math.abs(projectedY) > Math.min(screenHeight * 0.14, 110);
      isDragging = false;
      window.cancelAnimationFrame(rafId);
      rafId = 0;
      pages.forEach((page) => page.classList.remove("is-dragging"));

      if (shouldMove) {
        goToPage(currentPage + (projectedY < 0 ? 1 : -1));
      } else {
        setPages(0);
      }
    }

    function handleWheel(event) {
      event.preventDefault();

      if (isAnimating || Math.abs(event.deltaY) < 18) return;

      window.clearTimeout(wheelTimer);
      wheelTimer = window.setTimeout(() => {
        goToPage(currentPage + (event.deltaY > 0 ? 1 : -1));
      }, 40);
    }

    phoneScreen.addEventListener("touchstart", startDrag, { passive: false });
    phoneScreen.addEventListener("touchmove", moveDrag, { passive: false });
    phoneScreen.addEventListener("touchend", endDrag);
    phoneScreen.addEventListener("touchcancel", endDrag);
    phoneScreen.addEventListener("wheel", handleWheel, { passive: false });
    prevButton.addEventListener("click", () => goToPage(currentPage - 1));
    nextButton.addEventListener("click", () => goToPage(currentPage + 1));
    window.addEventListener("load", () => setPages(0));

    setPages(0);
  </script>
</body>
</html>
