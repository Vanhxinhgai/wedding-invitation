<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thư mời cưới</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .phone-screen {
      width: 100vw;
      height: 100vh;
      background: #f7f7f7;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      position: relative;
    }

    .page {
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 24px 78px;
      overflow: hidden;
    }

    .page-content {
      width: 100%;
      max-width: 360px;
      text-align: center;
      opacity: 0;
      transform: translateY(60px);
      transition: all 1s ease;
    }

    .page.active .page-content {
      opacity: 1;
      transform: translateY(0);
    }

    .text-box {
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(45px) scale(0.96);
      filter: blur(8px);
      transition:
        opacity 1.2s ease,
        transform 1.2s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.2s ease;
    }

    .page.active .text-box {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .small-text {
      font-size: 11px;
      letter-spacing: 3px;
      color: #b5b5b5;
      margin-bottom: 10px;
    }

    .main-title {
      font-family: Georgia, serif;
      font-size: 25px;
      line-height: 1.45;
      color: #a9a9a9;
      font-weight: bold;
    }

    .sub-text {
      margin-top: 10px;
      font-size: 12px;
      color: #b8b8b8;
      letter-spacing: 1.5px;
      line-height: 1.7;
    }
    .small-text,
    .main-title,
    .sub-text {
      opacity: 0;
      transform: translateY(24px);
      filter: blur(6px);
      transition:
        opacity 1s ease,
        transform 1s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1s ease;
    }

    .page.active .small-text {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      transition-delay: 0.15s;
    }

    .page.active .main-title {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      transition-delay: 0.35s;
    }

    .page.active .sub-text {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
      transition-delay: 0.55s;
    }

    .invitation-img {
      width: 100%;
      max-height: 62vh;
      object-fit: contain;
      display: block;
      border-radius: 14px;
      opacity: 0;
      transform: scale(0.9) translateY(45px);
      transition: all 1s ease 0.35s;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.12);
    }

    .page.active .invitation-img {
      opacity: 0.92;
      transform: scale(1) translateY(0);
    }

    .hint {
      position: absolute;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #b7b7b7;
      letter-spacing: 1px;
      animation: floatHint 1.5s infinite;
    }

    @keyframes floatHint {
      0% {
        transform: translateX(-50%) translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: translateX(-50%) translateY(8px);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) translateY(0);
        opacity: 0.5;
      }
    }

    .bottom-icons {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 58px;
      background: rgba(247, 247, 247, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .icon-left,
    .icon-right {
      position: fixed;
      bottom: 18px;
      width: 28px;
      height: 28px;
      border: 1.5px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #333;
      background: #f7f7f7;
      z-index: 11;
    }

    .icon-left {
      left: 24px;
    }

    .icon-right {
      right: 24px;
    }

    @media screen and (min-width: 600px) {
      .phone-screen {
        width: 390px;
        height: 844px;
        margin: 30px auto;
        border-radius: 36px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      }

      .page {
        height: 844px;
      }

      .bottom-icons {
        width: 390px;
        left: 50%;
        transform: translateX(-50%);
        bottom: 30px;
        border-bottom-left-radius: 36px;
        border-bottom-right-radius: 36px;
      }

      .icon-left {
        left: calc(50% - 171px);
        bottom: 48px;
      }

      .icon-right {
        right: calc(50% - 171px);
        bottom: 48px;
      }
    }
  </style>
</head>

<body>
  <div class="phone-screen" id="phoneScreen">

    <section class="page active">
      <div class="page-content">
        <div class="text-box">
          <div class="small-text">SAVE THE DATE</div>
          <div class="main-title">
            PHƯƠNG THẢO<br />
            &<br />
            ĐỨC ANH
          </div>
          <div class="sub-text">14 . 06 . 2026</div>
        </div>

        <img class="invitation-img" src="assets/anh1.png" alt="Ảnh cưới 1" />
      </div>

      <div class="hint">LƯỚT XUỐNG</div>
    </section>

    <section class="page">
      <div class="page-content">
        <div class="text-box">
          <div class="small-text">TRÂN TRỌNG KÍNH MỜI</div>
          <div class="main-title">
            LỄ THÀNH HÔN
          </div>
          <div class="sub-text">Thân mời bạn cùng gia đình tham dự tiệc cưới</div>
        </div>

        <img class="invitation-img" src="assets/anh2.png" alt="Ảnh cưới 2" />
      </div>

      <div class="hint">LƯỚT XUỐNG</div>
    </section>

    <section class="page">
      <div class="page-content">
        <div class="text-box">
          <div class="small-text">WEDDING INVITATION</div>
          <div class="main-title">
            HẸN GẶP<br />
            TẠI BỮA TIỆC
          </div>
          <div class="sub-text">Sự hiện diện của bạn là niềm vui của gia đình</div>
        </div>

        <img class="invitation-img" src="assets/anh3.png" alt="Ảnh cưới 3" />
      </div>
    </section>

  </div>

  <div class="bottom-icons"></div>
  <div class="icon-left">⌕</div>
  <div class="icon-right">↑</div>

  <script>
    const phoneScreen = document.getElementById("phoneScreen");
    const pages = document.querySelectorAll(".page");

    function revealPage() {
      const screenRect = phoneScreen.getBoundingClientRect();

      pages.forEach((page) => {
        const rect = page.getBoundingClientRect();
        const pageCenter = rect.top + rect.height / 2;
        const screenCenter = screenRect.top + screenRect.height / 2;

        const distance = Math.abs(pageCenter - screenCenter);

        if (distance < screenRect.height * 0.35) {
          page.classList.add("active");
        } else {
          page.classList.remove("active");
        }
      });
    }

    phoneScreen.addEventListener("scroll", revealPage);
    window.addEventListener("load", revealPage);
  </script>
</body>
</html>
